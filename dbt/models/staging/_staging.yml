version: 2

models:
  - name: stg_orders
    description: "Commandes typées. Une ligne par commande (la dernière livraison gagne)."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships: { arguments: { to: ref('stg_customers'), field: customer_id } }
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: purchased_at
        data_tests: [not_null]

  - name: stg_order_items
    description: "Articles des commandes. Clé : (order_id, order_item_id)."
    data_tests:
      - unique_combination: { arguments: { columns: [order_id, order_item_id] } }
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships: { arguments: { to: ref('stg_orders'), field: order_id } }
      - name: product_id
        data_tests:
          - relationships: { arguments: { to: ref('stg_products'), field: product_id } }
      - name: seller_id
        data_tests:
          - relationships: { arguments: { to: ref('stg_sellers'), field: seller_id } }
      - name: price
        data_tests: [not_null, { non_negative: {} }]
      - name: freight_value
        data_tests: [not_null, { non_negative: {} }]

  - name: stg_order_payments
    description: "Paiements. Clé : (order_id, payment_sequential)."
    data_tests:
      - unique_combination: { arguments: { columns: [order_id, payment_sequential] } }
    columns:
      - name: order_id
        data_tests:
          - relationships: { arguments: { to: ref('stg_orders'), field: order_id } }
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value
        data_tests: [not_null, { non_negative: {} }]

  - name: stg_order_reviews
    description: "Avis. Clé : (review_id, order_id) ; une commande peut avoir plusieurs avis."
    data_tests:
      - unique_combination: { arguments: { columns: [review_id, order_id] } }
    columns:
      - name: review_score
        data_tests:
          - not_null
          - accepted_values: { arguments: { values: [1, 2, 3, 4, 5], quote: false } }

  - name: stg_customers
    description: "Un customer_id par commande ; customer_unique_id identifie la personne."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
      - name: state
        data_tests:
          - not_null
          - accepted_brazilian_state: {}

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
      - name: state
        data_tests: [{ accepted_brazilian_state: {} }]

  - name: stg_category_translation
    columns:
      - name: category_name_pt
        data_tests: [unique, not_null]

  - name: stg_geolocation
    description: "Points GPS bruts, plusieurs par préfixe de code postal, dont quelques-uns hors du Brésil."
